<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e14">
<title>Gemma</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237c6cf0'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23b9a8ff'/%3E%3C/svg%3E">
</head>
<body>

<div id="startup">
  <div class="startup-box">
    <div class="orb orb-startup" aria-hidden="true"></div>
    <h1>Gemma</h1>
    <p>Antippen startet Vollbild und hält das Display wach.</p>
    <button id="kiosk-btn" type="button">Starten</button>
    <p class="startup-hinweis" id="startup-hinweis">Danach den Orb antippen und sprechen.</p>
  </div>
</div>

<header>
  <div class="uhr-block">
    <div id="uhr" class="uhr">00:00</div>
    <div id="datum" class="datum">Sonntag, 7. Oktober</div>
  </div>
  <div class="orb-block">
    <button id="orb" class="orb" type="button" aria-label="Mit Gemma sprechen">
      <span class="orb-ring"></span>
      <span class="orb-kern" aria-hidden="true"></span>
    </button>
    <div id="orb-status" class="orb-status">Tippen und sprechen</div>
  </div>
  <div class="verbindungs-block">
    <button id="mikro-btn" class="mikro-btn" type="button">Mikro aktivieren</button>
    <span class="punkt-zeile">
      <span id="punkt" class="punkt" aria-hidden="true"></span>
      <span id="punkt-text" class="punkt-text"></span>
    </span>
  </div>
</header>

<main>
  <section class="gespraech-kachel" id="k-gespraech">
    <div class="kachel-label">Gespräch</div>
    <div id="chat" class="chat"></div>
  </section>

  <section class="raster">
    <div class="kachel" id="k-musik">
      <div class="kachel-label">Musik</div>
      <div class="musik-zeile">
        <img id="musik-cover" class="musik-cover" alt="" hidden>
        <div class="musik-text">
          <div id="musik-titel" class="kachel-wert">—</div>
          <div id="musik-kuenstler" class="kachel-zusatz">—</div>
        </div>
      </div>
      <div class="musik-tasten">
        <button class="taste" id="m-vorher" type="button" aria-label="Vorheriger Titel">&#9198;</button>
        <button class="taste taste-gross" id="m-play" type="button" aria-label="Abspielen oder Pause">&#9654;</button>
        <button class="taste" id="m-naechster" type="button" aria-label="Nächster Titel">&#9197;</button>
      </div>
    </div>

    <div class="kachel" id="k-vital">
      <div class="kachel-label">Vitaldaten</div>
      <div class="vital-raster">
        <div class="vital-wert"><span id="v-puls">—</span><small>Puls</small></div>
        <div class="vital-wert"><span id="v-schritte">—</span><small>Schritte</small></div>
        <div class="vital-wert"><span id="v-schlaf">—</span><small>Schlaf</small></div>
        <div class="vital-wert"><span id="v-ready">—</span><small>Fit</small></div>
      </div>
      <div id="v-alter" class="kachel-zusatz"></div>
    </div>

    <div class="kachel" id="k-heizung">
      <div class="kachel-label">Heizung</div>
      <div id="heizung-liste" class="heizung-liste"><div class="kachel-zusatz">—</div></div>
    </div>

    <div class="kachel" id="k-termine">
      <div class="kachel-label">Termine</div>
      <div id="termin-liste" class="termin-liste"><div class="kachel-zusatz">—</div></div>
    </div>
  </section>
</main>

<footer>
  <span id="fuss-hinweis" class="fuss-hinweis"></span>
</footer>

<div id="overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div id="overlay-box">
    <button id="overlay-x" type="button" aria-label="Schließen">&#10005;</button>
    <div id="overlay-label" class="ov-label"></div>
    <div id="overlay-inhalt" class="ov-inhalt"></div>
    <div id="overlay-meta" class="ov-meta"></div>
  </div>
</div>

<div id="tippen-overlay" aria-hidden="true">
  <div id="tippen-box">
    <div class="ov-label">Statt sprechen: tippen</div>
    <form id="tippen-form">
      <input id="tippen-eingabe" type="text" autocomplete="off"
             placeholder="Was soll Gemma tun?">
      <button type="submit">Senden</button>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
